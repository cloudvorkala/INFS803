service: paperbound-backend
frameworkVersion: '4.22.0'
configValidationMode: error
# Resolve deployment settings from backend/.env; never include that file in the ZIP.
useDotenv: true

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, env:AWS_REGION, 'ap-southeast-2'}
  stage: ${opt:stage, env:STAGE, 'dev'}
  architecture: x86_64
  timeout: 15
  memorySize: 512
  logRetentionInDays: 14
  environment:
    # AWS_REGION is reserved: Lambda supplies the actual deployment region.
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID}
    PRODUCTS_TABLE: ${env:PRODUCTS_TABLE}
    CARTS_TABLE: ${env:CARTS_TABLE}
    ORDERS_TABLE: ${env:ORDERS_TABLE}
    UPLOADS_BUCKET: ${env:UPLOADS_BUCKET}
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS, ''}
    JWKS_CACHE_SECONDS: ${env:JWKS_CACHE_SECONDS, '300'}
    JWKS_TIMEOUT_SECONDS: ${env:JWKS_TIMEOUT_SECONDS, '3'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            Fn::Sub:
              - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProductsTable}'
              - ProductsTable: ${env:PRODUCTS_TABLE}
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            Fn::Sub:
              - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CartsTable}'
              - CartsTable: ${env:CARTS_TABLE}
        # DynamoDB authorizes transaction members using PutItem/UpdateItem/DeleteItem.
        # Existing Product UpdateItem and Cart DeleteItem grants cover those members.
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource:
            Fn::Sub:
              - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTable}'
              - OrdersTable: ${env:ORDERS_TABLE}
          Condition:
            StringEquals:
              dynamodb:EnclosingOperation: TransactWriteItems
        # GET /orders reads only the caller's partition of the Orders table.
        - Effect: Allow
          Action:
            - dynamodb:Query
          Resource:
            Fn::Sub:
              - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTable}'
              - OrdersTable: ${env:ORDERS_TABLE}
        # POST /upload_file writes only under the publicly readable covers/uploads/ prefix.
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            Fn::Sub:
              - 'arn:${AWS::Partition}:s3:::${UploadsBucket}/covers/uploads/*'
              - UploadsBucket: ${env:UPLOADS_BUCKET}
  # No direct Orders writes, index access, other S3 actions, or Cognito IAM grants.
  # Leave deploymentBucket unset: Serverless artifacts use its own bucket, not UPLOADS_BUCKET.

functions:
  api:
    handler: lambda_handler.handler
    events:
      - http:
          path: /
          method: any
      - http:
          path: /{proxy+}
          method: any

# Framework v4 includes Python requirements packaging. The WSGI adapter is a
# Python dependency called by lambda_handler.py, so no WSGI npm plugin is needed.
custom:
  pythonRequirements:
    dockerizePip: true
    dockerImage: public.ecr.aws/sam/build-python3.12:latest-x86_64

package:
  patterns:
    - '!tests/**'
    - '!.venv/**'
    - '!**/__pycache__/**'
    - '!.pytest_cache/**'
    - '!.env*'
    - '!**/.env*'
    - '!node_modules/**'
    - '!requirements-dev.txt'
    - '!pytest.ini'
    - '!README.md'
    - '!package*.json'

# Existing tables, bucket, and pool are referenced above, never created here.
