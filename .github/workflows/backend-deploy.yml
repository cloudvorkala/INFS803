# Tests, then deploys the Flask API (Lambda + API Gateway) to the dev stage with Serverless Framework.
# Required repository settings (Settings -> Secrets and variables -> Actions):
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (a deploy-only IAM user, or switch to OIDC below)
#              SERVERLESS_ACCESS_KEY                     (Serverless Framework v4 dashboard -> Access keys)
#   Variables: COGNITO_USER_POOL_ID, COGNITO_APP_CLIENT_ID, PRODUCTS_TABLE, CARTS_TABLE,
#              ORDERS_TABLE, UPLOADS_BUCKET, ALLOWED_ORIGINS
# These replace backend/.env, which is never committed.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false   # Never interrupt a CloudFormation update half-way

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest   # Docker is available here for dockerizePip packaging
    defaults:
      run:
        working-directory: backend
    env:
      STAGE: dev
      AWS_REGION: ap-southeast-2
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
      PRODUCTS_TABLE: ${{ vars.PRODUCTS_TABLE }}
      CARTS_TABLE: ${{ vars.CARTS_TABLE }}
      ORDERS_TABLE: ${{ vars.ORDERS_TABLE }}
      UPLOADS_BUCKET: ${{ vars.UPLOADS_BUCKET }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Safer alternative: create an IAM role trusted by GitHub OIDC, remove the two keys
          # above, add `role-to-assume: <role ARN>`, and grant `id-token: write` in permissions.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install the pinned Serverless CLI
        run: npm ci
      - name: Deploy
        run: npx --no-install serverless deploy --stage dev --region ap-southeast-2
      - name: Smoke test the public catalogue
        run: |
          url="https://8lvgv7w3l0.execute-api.ap-southeast-2.amazonaws.com/dev/products"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          echo "GET /products -> $code"
          test "$code" = "200"
